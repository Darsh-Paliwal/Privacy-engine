<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Shopping Cart</h1>
      <p class="subtitle">Review items in your order.</p>

      <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; color: #fff;">
        <thead>
          <tr style="border-bottom: 1px solid #334155; text-align: left;">
            <th>Product</th>
            <th>Quantity</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Wireless Headphones</td>
            <td>1</td>
            <td>$99.00</td>
          </tr>
        </tbody>
      </table>

      <button type="button" style="width: 100%; padding: 10px; background: #38bdf8; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer;">
        Checkout
      </button>
    </section>
  </main>
</body>
</html>
