<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application - Step 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="progress">
        <span class="active"></span>
        <span></span>
      </div>

      <h1>Job Application</h1>
      <p class="subtitle">Tell us a little about yourself to get started.</p>

      <form onsubmit="event.preventDefault(); window.location.href='page2.html';">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
        </div>

        <div class="form-group">
          <label for="college">College</label>
          <input type="text" id="college" name="college" placeholder="Enter your college name" required>
        </div>

        <button type="submit">Next</button>
      </form>
    </section>
  </main>
</body>
</html>
